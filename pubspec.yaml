name: makeup_calendar
description: "מערכת מתקדמת לניהול תורים ויומן עבודה לסטודיו איפור"
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ניהול מצב (state management)
  provider: ^6.1.2

  # אחסון מקומי
  shared_preferences: ^2.2.3

  # תקשורת רשת (סנכרון GitHub)
  http: ^1.2.1

  # תאריכים ופורמט עברי
  intl: ^0.20.2

  # פתיחת קישורים / חיוג טלפוני
  url_launcher: ^6.2.6

  # מזהים ייחודיים לתורים
  uuid: ^4.4.0

  # לוח שנה עברי (המרה, שמות חודשים וגימטריה)
  kosher_dart: ^2.0.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
